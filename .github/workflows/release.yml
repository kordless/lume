name: Publish GitHub Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: lume-linux-x86_64
            archive_name: lume-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: lume-macos-x86_64
            archive_name: lume-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: lume-macos-aarch64
            archive_name: lume-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: lume-windows-x86_64
            archive_name: lume-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-release-

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Organize & Package Artifacts (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          # Package the main lume unibinary plus backward compatible ones
          cp target/${{ matrix.target }}/release/lume dist/
          cp target/${{ matrix.target }}/release/tag dist/ || true
          cp target/${{ matrix.target }}/release/tag-server dist/ || true
          cp target/${{ matrix.target }}/release/search dist/ || true
          cp target/${{ matrix.target }}/release/hatcher-boost dist/ || true
          cp README.md LICENSE dist/
          cd dist
          tar -czf ../${{ matrix.archive_name }} *

      - name: Organize & Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\lume.exe dist\
          copy target\${{ matrix.target }}\release\tag.exe dist\ -ErrorAction SilentlyContinue
          copy target\${{ matrix.target }}\release\tag-server.exe dist\ -ErrorAction SilentlyContinue
          copy target\${{ matrix.target }}\release\search.exe dist\ -ErrorAction SilentlyContinue
          copy target\${{ matrix.target }}\release\hatcher-boost.exe dist\ -ErrorAction SilentlyContinue
          copy README.md dist\
          copy LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive_name }}

      - name: Create or Update GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
